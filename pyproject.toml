[project]
name = "cascadelad"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "hydra-core>=1.3.8",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cascadelad"]

[tool.ruff]
line-length = 100
extend-exclude = [".agentkit", ".claude"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
