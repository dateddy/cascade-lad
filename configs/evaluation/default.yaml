# @package evaluation
bootstrap:
  n_resamples: 1000
  seed: 0
  ci_level: 0.95
  block_length: null  # circular block bootstrap; null = ceil(n^(1/3)), 1 = iid (D-b6c5)
  metrics: [f1, recall]  # metrics that get a CI in evaluate() and the CI table (D-5a19)
flag_rates: [0.1, 0.2]  # recall@flag-rate columns (R@10%, R@20%)
std_ddof: 1  # sample std for mean ± std over seeds (D-e411)
decimals: 4  # metric table precision (D-c59c)
