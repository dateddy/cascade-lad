# @package model
name: pca
decision: threshold  # scored, then thresholded by the threshold policy
term_weighting: tfidf  # tfidf | none; idf = log((N + 1) / (df + 1)) from train
normalization: zero_mean  # train mean is subtracted
n_components: 0.95  # float in (0, 1] = share of train variance kept; int = number of components
